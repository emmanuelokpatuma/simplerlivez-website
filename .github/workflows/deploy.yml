name: Build and deploy simplerlivez.com
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 9 * * *"   # daily refresh so /links shows the newest articles
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml jinja2
      - run: python build.py
      - name: Publish built site to the deploy branch (Hostinger pulls this)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./public
          force_orphan: false
